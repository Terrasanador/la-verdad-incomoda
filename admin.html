<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Panel de Administración | La Verdad Incómoda</title>
  <style>
    :root{--bg:#070708;--panel:#121216;--panel2:#19191f;--border:#34343c;--text:#fff;--muted:#b7b7c0;--red:#ff3b30;--green:#43d392;--yellow:#f2c94c}
    *{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at 50% 0%,#2a1010 0%,#0c0c0e 35%,var(--bg) 75%);color:var(--text);min-height:100vh}
    header{position:sticky;top:0;z-index:5;background:rgba(7,7,8,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
    .nav{max-width:1200px;margin:auto;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:900}.brand span{color:var(--red)}
    main{max-width:1200px;margin:auto;padding:24px 16px 70px}.grid{display:grid;grid-template-columns:320px 1fr;gap:18px}@media(max-width:900px){.grid{grid-template-columns:1fr}}
    .panel{background:rgba(18,18,22,.96);border:1px solid var(--border);border-radius:18px;padding:16px;box-shadow:0 18px 60px rgba(0,0,0,.32)}
    h1,h2,h3{margin:0 0 12px}p{color:var(--muted);line-height:1.5}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.stat{padding:12px;border:1px solid var(--border);border-radius:14px;background:var(--panel2);text-align:center}.stat strong{display:block;font-size:22px}
    label{display:block;font-weight:700;font-size:13px;margin:12px 0 6px}input,textarea,select{width:100%;border:1px solid var(--border);border-radius:12px;background:#0d0d10;color:#fff;padding:12px;font:inherit}textarea{min-height:160px;resize:vertical}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:650px){.row{grid-template-columns:1fr}}
    button{border:0;border-radius:12px;padding:11px 14px;font-weight:800;cursor:pointer}.primary{background:var(--red);color:#fff}.secondary{background:#24242b;color:#fff;border:1px solid var(--border)}.success{background:var(--green);color:#06150f}.danger{background:#501b1b;color:#fff}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
    .item{border:1px solid var(--border);border-radius:14px;padding:12px;background:#0f0f13;margin-bottom:10px}.item-top{display:flex;justify-content:space-between;gap:10px}.badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:900}.pub{background:rgba(67,211,146,.15);color:#7ef0b9}.draft{background:rgba(242,201,76,.14);color:#f6d970}.item small{color:var(--muted)}
    .preview{border:1px dashed var(--border);border-radius:14px;padding:14px;background:#0b0b0e}.preview h2{margin-top:0}.empty{color:var(--muted);text-align:center;padding:28px 8px}.hidden{display:none!important}
    .notice{padding:10px 12px;border-radius:12px;margin:0 0 14px;background:rgba(242,201,76,.1);border:1px solid rgba(242,201,76,.35);color:#ffe89c;font-size:13px}
  </style>
</head>
<body>
<header><div class="nav"><div class="brand">LA VERDAD <span>INCÓMODA</span> · ADMIN</div><button class="secondary" id="exportTop">Exportar respaldo</button></div></header>
<main>
  <div class="notice">Primera versión operativa: administra artículos y categorías desde tu navegador. Los datos se guardan en este dispositivo y puedes exportarlos como respaldo JSON.</div>
  <div class="grid">
    <aside class="panel">
      <h2>Contenido</h2>
      <div class="stats"><div class="stat"><strong id="totalStat">0</strong><span>Total</span></div><div class="stat"><strong id="pubStat">0</strong><span>Publicados</span></div><div class="stat"><strong id="draftStat">0</strong><span>Borradores</span></div></div>
      <div class="toolbar"><button class="primary" id="newBtn">Nuevo artículo</button><button class="secondary" id="importBtn">Importar</button><input class="hidden" id="importFile" type="file" accept="application/json" /></div>
      <label for="search">Buscar</label><input id="search" placeholder="Título, categoría o autor" />
      <div id="list" style="margin-top:14px"></div>
    </aside>

    <section class="panel">
      <h1 id="formTitle">Nuevo artículo</h1>
      <input type="hidden" id="articleId" />
      <label for="title">Título</label><input id="title" maxlength="120" placeholder="Título del artículo" />
      <div class="row"><div><label for="slug">URL amigable</label><input id="slug" placeholder="titulo-del-articulo" /></div><div><label for="category">Categoría</label><input id="category" list="categories" placeholder="Verificaciones" /><datalist id="categories"></datalist></div></div>
      <div class="row"><div><label for="author">Autor</label><input id="author" placeholder="Manuel Méndez Feregrino" /></div><div><label for="status">Estado</label><select id="status"><option value="draft">Borrador</option><option value="published">Publicado</option></select></div></div>
      <label for="summary">Resumen</label><textarea id="summary" style="min-height:90px" placeholder="Resumen breve para buscadores y redes sociales"></textarea>
      <label for="content">Contenido</label><textarea id="content" placeholder="Escribe el contenido completo"></textarea>
      <label for="sources">Fuentes consultadas (una por línea)</label><textarea id="sources" style="min-height:100px" placeholder="https://fuente-oficial.mx/..."></textarea>
      <div class="toolbar"><button class="success" id="saveBtn">Guardar</button><button class="secondary" id="previewBtn">Vista previa</button><button class="danger hidden" id="deleteBtn">Eliminar</button></div>
      <div id="preview" class="preview hidden" style="margin-top:18px"></div>
    </section>
  </div>
</main>
<script>
(() => {
  const KEY='lvi_admin_articles_v1';
  const DEFAULT_CATEGORIES=['Verificaciones','Investigaciones','Tecnología','Ciencia','Política','Economía','Internacional','Salud'];
  const $=id=>document.getElementById(id);
  let articles=load();

  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}
  function persist(){localStorage.setItem(KEY,JSON.stringify(articles));renderList();updateStats();renderCategories()}
  function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
  function slugify(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')}
  function now(){return new Date().toISOString()}
  function resetForm(){['articleId','title','slug','category','summary','content','sources'].forEach(id=>$(id).value='');$('author').value='Manuel Méndez Feregrino';$('status').value='draft';$('formTitle').textContent='Nuevo artículo';$('deleteBtn').classList.add('hidden');$('preview').classList.add('hidden')}
  function current(){return {id:$('articleId').value||crypto.randomUUID(),title:$('title').value.trim(),slug:slugify($('slug').value||$('title').value),category:$('category').value.trim()||'Sin categoría',author:$('author').value.trim()||'La Verdad Incómoda',status:$('status').value,summary:$('summary').value.trim(),content:$('content').value.trim(),sources:$('sources').value.split('\n').map(x=>x.trim()).filter(Boolean),updatedAt:now()}}
  function save(){const a=current();if(!a.title){alert('Escribe un título.');return}if(!a.content){alert('Escribe el contenido.');return}const i=articles.findIndex(x=>x.id===a.id);if(i>=0)a.createdAt=articles[i].createdAt||now(),articles[i]=a;else a.createdAt=now(),articles.unshift(a);persist();edit(a.id);alert('Artículo guardado en este dispositivo.')}
  function edit(id){const a=articles.find(x=>x.id===id);if(!a)return;$('articleId').value=a.id;$('title').value=a.title;$('slug').value=a.slug;$('category').value=a.category;$('author').value=a.author;$('status').value=a.status;$('summary').value=a.summary||'';$('content').value=a.content||'';$('sources').value=(a.sources||[]).join('\n');$('formTitle').textContent='Editar artículo';$('deleteBtn').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})}
  function remove(){const id=$('articleId').value;if(!id)return;if(confirm('¿Eliminar este artículo?')){articles=articles.filter(x=>x.id!==id);persist();resetForm()}}
  function preview(){const a=current();$('preview').innerHTML=`<small>${esc(a.category)} · ${a.status==='published'?'Publicado':'Borrador'}</small><h2>${esc(a.title||'Sin título')}</h2><p><strong>${esc(a.author)}</strong></p><p>${esc(a.summary)}</p><div>${esc(a.content).replace(/\n/g,'<br>')}</div>${a.sources.length?`<h3>Fuentes</h3><ul>${a.sources.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`:''}`;$('preview').classList.remove('hidden')}
  function renderList(){const q=$('search').value.toLowerCase().trim();const rows=articles.filter(a=>[a.title,a.category,a.author].join(' ').toLowerCase().includes(q));$('list').innerHTML=rows.length?rows.map(a=>`<div class="item" data-id="${a.id}"><div class="item-top"><strong>${esc(a.title)}</strong><span class="badge ${a.status==='published'?'pub':'draft'}">${a.status==='published'?'Publicado':'Borrador'}</span></div><small>${esc(a.category)} · ${new Date(a.updatedAt).toLocaleDateString('es-MX')}</small></div>`).join(''):'<div class="empty">No hay artículos todavía.</div>';document.querySelectorAll('.item').forEach(el=>el.addEventListener('click',()=>edit(el.dataset.id)))}
  function updateStats(){$('totalStat').textContent=articles.length;$('pubStat').textContent=articles.filter(a=>a.status==='published').length;$('draftStat').textContent=articles.filter(a=>a.status!=='published').length}
  function renderCategories(){const cats=[...new Set([...DEFAULT_CATEGORIES,...articles.map(a=>a.category).filter(Boolean)])].sort();$('categories').innerHTML=cats.map(c=>`<option value="${esc(c)}"></option>`).join('')}
  function exportData(){const blob=new Blob([JSON.stringify({project:'La Verdad Incómoda',version:1,exportedAt:now(),articles},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`lvi-contenido-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(url)}
  function importData(file){const r=new FileReader();r.onload=()=>{try{const data=JSON.parse(r.result);const incoming=Array.isArray(data)?data:data.articles;if(!Array.isArray(incoming))throw new Error();articles=incoming;persist();resetForm();alert('Contenido importado correctamente.')}catch{alert('El archivo no es un respaldo válido.')}};r.readAsText(file)}

  $('title').addEventListener('input',()=>{if(!$('articleId').value||!$('slug').dataset.manual)$('slug').value=slugify($('title').value)});
  $('slug').addEventListener('input',()=>{$('slug').dataset.manual='1'});
  $('saveBtn').addEventListener('click',save);$('previewBtn').addEventListener('click',preview);$('deleteBtn').addEventListener('click',remove);$('newBtn').addEventListener('click',resetForm);$('search').addEventListener('input',renderList);$('exportTop').addEventListener('click',exportData);$('importBtn').addEventListener('click',()=>$('importFile').click());$('importFile').addEventListener('change',()=>{const f=$('importFile').files[0];if(f)importData(f)});
  resetForm();persist();
})();
</script>
</body>
</html>
