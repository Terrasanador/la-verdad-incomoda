<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Administración | La Verdad Incómoda</title>
<style>
:root{--bg:#070708;--panel:#121216;--border:#34343d;--text:#fff;--muted:#b9b9c2;--red:#ff3b30;--green:#46d79a}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#281010,#070708 45%);color:var(--text);font-family:Arial,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:1px solid var(--border);background:#09090b;position:sticky;top:0;z-index:5}
.brand{font-weight:900}.brand span{color:var(--red)}button,input,textarea,select{font:inherit}
button{border:0;border-radius:10px;padding:11px 14px;font-weight:800;cursor:pointer;background:#292930;color:white}.primary{background:var(--red)}.save{background:var(--green);color:#07140e}
main{width:min(1180px,calc(100% - 22px));margin:18px auto}.login,.panel{background:rgba(18,18,22,.96);border:1px solid var(--border);border-radius:17px;padding:16px}
.login{max-width:520px;margin:60px auto}.login input{width:100%;margin:12px 0}
.grid{display:grid;grid-template-columns:330px 1fr;gap:14px}.sidebar,.editor{background:rgba(18,18,22,.96);border:1px solid var(--border);border-radius:17px;padding:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{background:#1a1a20;border:1px solid var(--border);border-radius:11px;text-align:center;padding:11px}.stat b{font-size:22px;display:block}
input,textarea,select{width:100%;background:#0d0d10;color:white;border:1px solid var(--border);border-radius:10px;padding:11px;margin:5px 0 12px}
textarea{min-height:120px;resize:vertical}.content{min-height:290px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.article{border:1px solid var(--border);border-radius:11px;padding:10px;margin:9px 0;background:#17171c;cursor:pointer}.article small{display:block;color:var(--muted);margin-top:5px}.article.active{border-color:var(--red)}
.actions{display:flex;flex-wrap:wrap;gap:8px}.notice{color:#ffd29c;background:#332411;border:1px solid #6c4b20;padding:10px;border-radius:10px;margin-bottom:13px}.ok{color:#aaf0d1}.error{color:#ff9a95}
.hidden{display:none!important}
@media(max-width:760px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}header{gap:8px}.sidebar{order:2}.editor{order:1}}
</style>
</head>
<body>
<header><div class="brand">LA VERDAD <span>INCÓMODA</span> · ADMIN</div><button id="logout" class="hidden">Cerrar sesión</button></header>
<main>
<section id="login" class="login">
<h1>Acceso administrativo</h1>
<p style="color:var(--muted)">Escribe la contraseña configurada en Vercel.</p>
<input id="password" type="password" autocomplete="current-password" placeholder="Contraseña">
<button id="enter" class="primary">Entrar</button>
<p id="loginMsg"></p>
</section>

<section id="app" class="hidden">
<div class="notice">Los artículos se guardan permanentemente en <b>content.json</b> dentro de GitHub. Cada guardado crea un nuevo despliegue en Vercel.</div>
<div class="grid">
<aside class="sidebar">
<div class="stats"><div class="stat"><b id="total">0</b>Total</div><div class="stat"><b id="published">0</b>Publicados</div><div class="stat"><b id="drafts">0</b>Borradores</div></div>
<div class="actions" style="margin:12px 0"><button id="new" class="primary">Nuevo artículo</button><a href="/articles.html" target="_blank"><button>Ver publicados</button></a></div>
<input id="search" placeholder="Buscar título, autor o categoría">
<div id="list"></div>
</aside>
<section class="editor">
<h1 id="formTitle">Nuevo artículo</h1>
<input id="id" type="hidden">
<label>Título</label><input id="title" placeholder="Título del artículo">
<div class="row"><div><label>URL amigable</label><input id="slug" placeholder="titulo-del-articulo"></div><div><label>Categoría</label><input id="category" value="Verificaciones"></div></div>
<div class="row"><div><label>Autor</label><input id="author" value="Manuel Méndez Feregrino"></div><div><label>Estado</label><select id="status"><option value="draft">Borrador</option><option value="published">Publicado</option></select></div></div>
<label>Resumen</label><textarea id="summary" placeholder="Resumen para buscadores y redes sociales"></textarea>
<label>Contenido</label><textarea id="content" class="content" placeholder="Escribe el contenido completo. Se respetarán los saltos de línea."></textarea>
<label>Fuentes consultadas, una por línea</label><textarea id="sources" placeholder="https://fuente-oficial.mx/..."></textarea>
<div class="actions"><button id="save" class="save">Guardar</button><button id="preview">Vista previa</button><button id="delete">Eliminar</button></div>
<p id="message"></p>
</section>
</div>
</section>
</main>
<script>
const $=id=>document.getElementById(id); let password="", articles=[], currentId="";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
function slugify(s){return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,100)}
async function api(method="GET",body){
 const r=await fetch("/api/content",{method,headers:{"Content-Type":"application/json","X-Admin-Password":password},body:body?JSON.stringify(body):undefined});
 const data=await r.json().catch(()=>({}));
 if(!r.ok) throw new Error(data.error||`Error HTTP ${r.status}`); return data;
}
async function login(){
 password=$("password").value; $("loginMsg").textContent="Comprobando…";
 try{const data=await api();articles=data.articles||[];sessionStorage.setItem("lvi_admin_password",password);$("login").classList.add("hidden");$("app").classList.remove("hidden");$("logout").classList.remove("hidden");render();clearForm();}catch(e){$("loginMsg").className="error";$("loginMsg").textContent=e.message}
}
function render(){
 const q=$("search").value.toLowerCase(); const visible=articles.filter(a=>[a.title,a.author,a.category].join(" ").toLowerCase().includes(q));
 $("total").textContent=articles.length;$("published").textContent=articles.filter(a=>a.status==="published").length;$("drafts").textContent=articles.filter(a=>a.status!=="published").length;
 $("list").innerHTML=visible.length?visible.map(a=>`<div class="article ${a.id===currentId?"active":""}" data-id="${esc(a.id)}"><b>${esc(a.title)}</b><small>${esc(a.category)} · ${a.status==="published"?"Publicado":"Borrador"}</small></div>`).join(""):"<p style='color:#999'>No hay artículos todavía.</p>";
 document.querySelectorAll(".article").forEach(x=>x.onclick=()=>edit(x.dataset.id));
}
function clearForm(){currentId="";$("formTitle").textContent="Nuevo artículo";["id","title","slug","summary","content","sources"].forEach(x=>$(x).value="");$("category").value="Verificaciones";$("author").value="Manuel Méndez Feregrino";$("status").value="draft";$("message").textContent="";render()}
function edit(id){const a=articles.find(x=>x.id===id);if(!a)return;currentId=id;$("formTitle").textContent="Editar artículo";$("id").value=a.id;$("title").value=a.title||"";$("slug").value=a.slug||"";$("category").value=a.category||"";$("author").value=a.author||"";$("status").value=a.status||"draft";$("summary").value=a.summary||"";$("content").value=a.content||"";$("sources").value=(a.sources||[]).join("\n");render();scrollTo({top:0,behavior:"smooth"})}
function payload(){return{id:$("id").value,title:$("title").value,slug:$("slug").value||slugify($("title").value),category:$("category").value,author:$("author").value,status:$("status").value,summary:$("summary").value,content:$("content").value,sources:$("sources").value}}
async function save(){const btn=$("save");btn.disabled=true;$("message").textContent="Guardando en GitHub…";try{const data=await api(currentId?"PUT":"POST",payload());const idx=articles.findIndex(x=>x.id===data.article.id);if(idx>=0)articles[idx]=data.article;else articles.unshift(data.article);currentId=data.article.id;$("id").value=currentId;$("message").className="ok";$("message").textContent="Guardado. Vercel publicará el cambio en unos momentos.";render()}catch(e){$("message").className="error";$("message").textContent=e.message}finally{btn.disabled=false}}
async function remove(){if(!currentId)return alert("Selecciona un artículo.");if(!confirm("¿Eliminar este artículo definitivamente?"))return;try{await api("DELETE",{id:currentId});articles=articles.filter(x=>x.id!==currentId);clearForm();$("message").className="ok";$("message").textContent="Artículo eliminado."}catch(e){alert(e.message)}}
function preview(){const data=payload();const w=open("","_blank");w.document.write(`<meta charset="utf-8"><title>${esc(data.title)}</title><style>body{font-family:Arial;max-width:760px;margin:40px auto;padding:20px;line-height:1.65}small{color:#666}pre{white-space:pre-wrap;font:inherit}</style><small>${esc(data.category)} · ${esc(data.author)}</small><h1>${esc(data.title)}</h1><p><b>${esc(data.summary)}</b></p><pre>${esc(data.content)}</pre>`);w.document.close()}
$("enter").onclick=login;$("password").onkeydown=e=>{if(e.key==="Enter")login()};$("new").onclick=clearForm;$("save").onclick=save;$("delete").onclick=remove;$("preview").onclick=preview;$("search").oninput=render;$("title").oninput=()=>{if(!currentId)$("slug").value=slugify($("title").value)};
$("logout").onclick=()=>{sessionStorage.removeItem("lvi_admin_password");location.reload()};
const remembered=sessionStorage.getItem("lvi_admin_password");if(remembered){$("password").value=remembered;login()}
</script>
</body></html>
