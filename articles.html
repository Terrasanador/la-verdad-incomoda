<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Artículos y verificaciones | La Verdad Incómoda</title>
<meta name="description" content="Artículos, investigaciones y verificaciones publicadas por La Verdad Incómoda.">
<link rel="canonical" href="https://www.laverdadincomoda.mx/articles.html">
<style>
:root{--bg:#070708;--panel:#151519;--border:#373740;--text:#fff;--muted:#b8b8c1;--red:#ff3b30}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#291010,#070708 42%);color:var(--text);font-family:Arial,sans-serif}
header{padding:18px;border-bottom:1px solid var(--border);background:#09090b}.brand{font-weight:900}.brand span{color:var(--red)}main{width:min(1050px,calc(100% - 24px));margin:35px auto}
.hero{text-align:center;margin-bottom:25px}h1{font-size:clamp(34px,7vw,62px);margin:0}.hero p{color:var(--muted)}
input{width:100%;padding:13px;border-radius:12px;border:1px solid var(--border);background:#101014;color:#fff;margin:15px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:13px}.card{display:block;color:inherit;text-decoration:none;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:17px}.card:hover{border-color:var(--red)}.tag{color:#ff8e88;font-size:12px;font-weight:bold}.card p{color:var(--muted);line-height:1.5}.card small{color:#85858e}
</style></head><body>
<header><div class="brand"><a href="/" style="color:inherit;text-decoration:none">LA VERDAD <span>INCÓMODA</span></a></div></header>
<main><section class="hero"><h1>Verificaciones y artículos</h1><p>Contenido publicado con fuentes y contexto verificable.</p></section>
<input id="search" placeholder="Buscar por título, categoría o autor"><div id="grid" class="grid"></div><p id="msg"></p></main>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));let articles=[];
function render(){const q=document.getElementById("search").value.toLowerCase();const list=articles.filter(a=>[a.title,a.category,a.author,a.summary].join(" ").toLowerCase().includes(q));document.getElementById("grid").innerHTML=list.map(a=>`<a class="card" href="/article.html?slug=${encodeURIComponent(a.slug)}"><div class="tag">${esc(a.category)}</div><h2>${esc(a.title)}</h2><p>${esc(a.summary||"")}</p><small>${esc(a.author)} · ${new Date(a.publishedAt||a.updatedAt).toLocaleDateString("es-MX")}</small></a>`).join("");document.getElementById("msg").textContent=list.length?"":"Todavía no hay artículos publicados."}
fetch("/api/content").then(r=>r.json()).then(d=>{articles=d.articles||[];render()}).catch(()=>document.getElementById("msg").textContent="No fue posible cargar los artículos.");
document.getElementById("search").oninput=render;
</script></body></html>
