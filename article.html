<html lang="es"><head>

<title>Redirigiendo al artículo | La Verdad Incómoda</title>

<p>Redirigiendo al artículo…</p>
<script>
const slug=new URLSearchParams(location.search).get("slug");
if(slug&&/^[a-z0-9-]+$/.test(slug))location.replace(`/articulos/${encodeURIComponent(slug)}`);
else location.replace("/articles.html");
</script>
</body></html>
